<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greenway Groceries - Notifications</title>
    <!-- Jakarta Font & Lucide Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Base Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <meta name="theme-color" content="#07090d">
    <style>
        .notif-filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .notif-filter-bar::-webkit-scrollbar {
            display: none;
        }
        .notif-filter-pill {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .notif-filter-pill:active, .notif-filter-pill.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .notif-section-title {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            margin: 16px 0 8px 4px;
        }
        .notifications-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .notif-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            position: relative;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
            align-items: flex-start;
        }
        .notif-card:active {
            background-color: var(--surface-sec);
            transform: scale(0.99);
        }
        .notif-card.unread {
            border-left: 3.5px solid var(--primary);
            background: var(--surface);
        }
        .notif-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .notif-icon-badge svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2px;
        }
        .notif-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .notif-header-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .notif-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .notif-priority-tag {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .priority-critical {
            background: var(--danger-tint);
            color: var(--danger);
        }
        .priority-high {
            background: var(--warning-tint);
            color: var(--warning);
        }
        .notif-msg {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
            font-weight: 500;
            margin-top: 1px;
            word-break: break-word;
        }
        .notif-time {
            font-size: 0.68rem;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 600;
        }
        .notif-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            align-self: center;
        }
        .notif-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: background-color 0.2s, color 0.2s;
        }
        .notif-btn:active {
            background-color: var(--border);
            color: var(--text);
        }
        .notif-btn svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.2px;
        }
    </style>
</head>
<body data-page="notifications">

    <!-- Injected Global Header -->
    <div id="app-header"></div>

    <main class="container" style="padding-bottom: 80px;">
        <!-- Standard Page Header -->
        <div class="page-header" style="margin-bottom: 12px;">
            <a href="index.html" class="back-nav">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px; stroke-width: 2.5px;"></i> Dashboard
            </a>
            <div class="page-title-container" style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
                <div>
                    <h1 class="page-title">Notifications</h1>
                    <div class="page-title-accent"></div>
                    <p class="page-subtitle">Stay updated on inventory, customer dues, and sales</p>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn btn-outline btn-sm" id="btn-notif-read-all" style="min-height: 32px; padding: 4px 10px; font-size: 0.72rem; font-weight: 700;">
                        <i data-lucide="check-check" style="width: 13px; height: 13px;"></i> Mark all as read
                    </button>
                    <button class="btn btn-outline btn-sm" id="btn-notif-clear" style="min-height: 32px; padding: 4px 10px; font-size: 0.72rem; font-weight: 700; color: var(--danger); border-color: var(--border);">
                        <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i> Clear All
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Pills Bar -->
        <div class="notif-filter-bar" id="notif-filter-bar">
            <button class="notif-filter-pill active" data-filter="all">All</button>
            <button class="notif-filter-pill" data-filter="unread">Unread</button>
            <button class="notif-filter-pill" data-filter="stock">Stock</button>
            <button class="notif-filter-pill" data-filter="customers">Customers</button>
            <button class="notif-filter-pill" data-filter="payments">Payments</button>
            <button class="notif-filter-pill" data-filter="system">System</button>
        </div>

        <!-- Notifications Feed Container -->
        <div id="notifications-list-container">
            <!-- Dynamically populated by renderNotifications() -->
        </div>
    </main>

    <!-- Injected Global Bottom Navigation -->
    <nav id="app-navigation"></nav>

    <!-- Application Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    
    <script>
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            // Run checks on load to make sure alerts are up to date
            Storage.runStockCheckAndNotify();

            renderNotifications();
            setupFilterListeners();
            setupActionButtons();
        });

        function setupFilterListeners() {
            const pills = document.querySelectorAll('.notif-filter-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', () => {
                    pills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    currentFilter = pill.dataset.filter;
                    renderNotifications();
                });
            });
        }

        function setupActionButtons() {
            document.getElementById('btn-notif-read-all')?.addEventListener('click', () => {
                NotificationService.markAllAsRead();
                Utils.showToast("All notifications marked as read.", "success");
                renderNotifications();
            });

            document.getElementById('btn-notif-clear')?.addEventListener('click', () => {
                Utils.confirm(
                    "Clear all notifications?",
                    "Are you sure you want to remove all notifications from history?",
                    () => {
                        NotificationService.clearAll();
                        Utils.showToast("Notification history cleared.", "success");
                        renderNotifications();
                    }
                );
            });
        }

        function renderNotifications() {
            const container = document.getElementById('notifications-list-container');
            if (!container) return;

            let notifications = Storage.getNotifications();

            // Filter notifications
            if (currentFilter === 'unread') {
                notifications = notifications.filter(n => !n.read);
            } else if (currentFilter === 'stock') {
                notifications = notifications.filter(n => n.type === 'LOW_STOCK' || n.type === 'OUT_OF_STOCK');
            } else if (currentFilter === 'customers') {
                notifications = notifications.filter(n => n.type === 'CUSTOMER_DUE' || n.type === 'CUSTOMER_OVERDUE');
            } else if (currentFilter === 'payments') {
                notifications = notifications.filter(n => n.type === 'PAYMENT_RECEIVED');
            } else if (currentFilter === 'system') {
                notifications = notifications.filter(n => n.type === 'SYSTEM' || n.type === 'SALE_COMPLETED' || n.type === 'DAILY_SUMMARY');
            }

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-md); margin-top: 10px;">
                        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--surface-sec); color: var(--text-muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
                            <i data-lucide="bell-off" style="width: 24px; height: 24px;"></i>
                        </div>
                        <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px;">No Notifications</h3>
                        <p style="font-size: 0.78rem; color: var(--text-muted); margin: 0;">You have no notifications in this category.</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            // Group notifications into TODAY, YESTERDAY, OLDER
            const todayStr = new Date().toDateString();
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toDateString();

            const groups = {
                'TODAY': [],
                'YESTERDAY': [],
                'OLDER': []
            };

            notifications.forEach(n => {
                const nDate = new Date(n.createdAt || n.date);
                const nDateStr = nDate.toDateString();

                if (nDateStr === todayStr) {
                    groups['TODAY'].push(n);
                } else if (nDateStr === yesterdayStr) {
                    groups['YESTERDAY'].push(n);
                } else {
                    groups['OLDER'].push(n);
                }
            });

            let html = '';

            for (const [sectionTitle, notifList] of Object.entries(groups)) {
                if (notifList.length === 0) continue;

                html += `<div class="notif-section-title">${sectionTitle}</div>`;
                html += `<div class="notifications-feed">`;

                notifList.forEach(n => {
                    let iconName = 'bell';
                    let badgeStyle = 'background-color: var(--surface-sec); color: var(--text-muted);';

                    if (n.type === 'OUT_OF_STOCK') {
                        iconName = 'package-x';
                        badgeStyle = 'background-color: var(--danger-tint); color: var(--danger);';
                    } else if (n.type === 'LOW_STOCK') {
                        iconName = 'triangle-alert';
                        badgeStyle = 'background-color: var(--warning-tint); color: var(--warning);';
                    } else if (n.type === 'CUSTOMER_OVERDUE') {
                        iconName = 'triangle-alert';
                        badgeStyle = 'background-color: var(--danger-tint); color: var(--danger);';
                    } else if (n.type === 'CUSTOMER_DUE') {
                        iconName = 'wallet-cards';
                        badgeStyle = 'background-color: var(--warning-tint); color: var(--warning);';
                    } else if (n.type === 'PAYMENT_RECEIVED') {
                        iconName = 'circle-dollar-sign';
                        badgeStyle = 'background-color: var(--success-tint); color: var(--success);';
                    } else if (n.type === 'SALE_COMPLETED') {
                        iconName = 'receipt';
                        badgeStyle = 'background-color: var(--surface-sec); color: var(--accent);';
                    } else if (n.type === 'DAILY_SUMMARY') {
                        iconName = 'bar-chart-2';
                        badgeStyle = 'background-color: var(--surface-sec); color: var(--accent);';
                    }

                    const timeStr = formatRelativeTime(n.createdAt || n.date);
                    const unreadClass = n.read ? '' : 'unread';

                    let priorityTag = '';
                    if (n.priority === 'CRITICAL') {
                        priorityTag = `<span class="notif-priority-tag priority-critical">Critical</span>`;
                    } else if (n.priority === 'HIGH') {
                        priorityTag = `<span class="notif-priority-tag priority-high">High</span>`;
                    }

                    html += `
                        <div class="notif-card ${unreadClass}" data-id="${n.id}" data-type="${n.type}" data-target="${n.entityId || n.targetId || ''}">
                            <div class="notif-icon-badge" style="${badgeStyle}">
                                <i data-lucide="${iconName}"></i>
                            </div>
                            <div class="notif-body">
                                <div class="notif-header-line">
                                    <span class="notif-title">
                                        ${n.title}
                                        ${priorityTag}
                                    </span>
                                </div>
                                <span class="notif-msg">${n.message}</span>
                                <span class="notif-time">${timeStr}</span>
                            </div>
                            <div class="notif-actions">
                                ${!n.read ? `<button class="notif-btn btn-read-single" data-id="${n.id}" title="Mark as read"><i data-lucide="check"></i></button>` : ''}
                                <button class="notif-btn btn-del-single" data-id="${n.id}" style="color:var(--danger);" title="Delete"><i data-lucide="trash-2"></i></button>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            }

            container.innerHTML = html;

            // Click handling on cards
            container.querySelectorAll('.notif-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.notif-btn')) return;

                    const id = card.dataset.id;
                    const type = card.dataset.type;
                    const target = card.dataset.target;

                    NotificationService.markAsRead(id);

                    if (type === 'LOW_STOCK' || type === 'OUT_OF_STOCK') {
                        if (target) {
                            window.location.href = `product-details.html?id=${target}`;
                        } else {
                            window.location.href = 'stock.html';
                        }
                    } else if (type === 'CUSTOMER_DUE' || type === 'CUSTOMER_OVERDUE' || type === 'PAYMENT_RECEIVED') {
                        if (target) {
                            window.location.href = `customer-details.html?id=${target}`;
                        } else {
                            window.location.href = 'customers.html';
                        }
                    } else if (type === 'SALE_COMPLETED') {
                        window.location.href = 'sales.html';
                    } else if (type === 'DAILY_SUMMARY') {
                        window.location.href = 'settings.html?section=reports';
                    }
                });
            });

            // Single mark read button
            container.querySelectorAll('.btn-read-single').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    NotificationService.markAsRead(id);
                    renderNotifications();
                });
            });

            // Single delete button
            container.querySelectorAll('.btn-del-single').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    NotificationService.deleteNotification(id);
                    renderNotifications();
                    Utils.showToast("Notification removed.", "info");
                });
            });

            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function formatRelativeTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHr = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHr / 24);

            if (diffMin < 1) return 'Just now';
            if (diffMin === 1) return '1 minute ago';
            if (diffMin < 60) return `${diffMin} minutes ago`;
            if (diffHr === 1) return '1 hour ago';
            if (diffHr < 24) return `${diffHr} hours ago`;
            if (diffDay === 1) return 'Yesterday';
            if (diffDay < 7) return `${diffDay} days ago`;
            return Utils.formatDate(dateStr);
        }
    </script>
</body>
</html>
