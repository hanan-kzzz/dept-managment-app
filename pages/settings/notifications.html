    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (!t) {
          try {
            var s = JSON.parse(localStorage.getItem('grocery_settings'));
            t = s && s.theme;
          } catch(e) {}
        }
        if (!t || t === 'system') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      })();
    </script>

    <style>
        .notif-filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .notif-filter-bar::-webkit-scrollbar {
            display: none;
        }
        .notif-filter-pill {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .notif-filter-pill:active, .notif-filter-pill.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .notif-section-title {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            margin: 16px 0 8px 4px;
        }
        .notifications-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        
        
        .notif-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .notif-icon-badge svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2px;
        }
        .notif-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .notif-header-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .notif-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .notif-priority-tag {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .priority-critical {
            background: var(--danger-tint);
            color: var(--danger);
        }
        .priority-high {
            background: var(--warning-tint);
            color: var(--warning);
        }
        .notif-msg {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
            font-weight: 500;
            margin-top: 1px;
            word-break: break-word;
        }
        .notif-time {
            font-size: 0.68rem;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 600;
        }
        .notif-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            align-self: center;
        }
        .notif-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: background-color 0.2s, color 0.2s;
        }
        .notif-btn:active {
            background-color: var(--border);
            color: var(--text);
        }
        .notif-btn svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.2px;
        }
    
        .notif-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease, margin 0.3s ease, transform 0.1s;
            overflow: hidden;
            max-height: 2000px; /* Large enough for groups */
        }
        .notif-card.removing {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-top: 0;
            margin-bottom: 0;
            border-width: 0;
        }
        .notif-content-wrapper {
            box-sizing: border-box;
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--surface);
            position: relative;
            z-index: 2;
            cursor: pointer;
            width: 100%;
            flex: 1 0 100%;
        }
        .notif-card:active .notif-content-wrapper {
            box-sizing: border-box;
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--surface);
            position: relative;
            z-index: 2;
            cursor: pointer;
            width: 100%;
            flex: 1 0 100%;
        }
        .notif-card.unread .notif-content-wrapper {
            box-sizing: border-box;
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--surface);
            position: relative;
            z-index: 2;
            cursor: pointer;
            width: 100%;
            flex: 1 0 100%;
        }
        .notif-card.severity-critical { border-left: 3.5px solid var(--danger); }
        .notif-card.severity-high { border-left: 3.5px solid var(--warning); }
        
        .swipe-actions {
            box-sizing: border-box;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: var(--danger);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            z-index: 1;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .notif-filter-pill .badge {
            background: var(--primary);
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 0.65rem;
            margin-left: 4px;
        }
        .notif-filter-pill.active .badge {
            background: white;
            color: var(--primary);
        }
        
        /* Group Styles */
        .notif-group-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            padding: 12px 14px;
            background: var(--surface);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .notif-group-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
        }
        .notif-group-content.expanded {
            max-height: 1500px;
            opacity: 1;
        }
        /* Sub-items in a group */
        .notif-sub-item {
            position: relative;
            border-top: 1px solid var(--border);
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
            max-height: 200px;
            background: var(--surface);
            display: flex;
            width: 100%;
            box-sizing: border-box;
        }
        .notif-sub-item.removing {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-top-width: 0;
        }
        .notif-sub-item .notif-content-wrapper {
            box-sizing: border-box;
            padding: 12px 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--surface);
            position: relative;
            z-index: 2;
            cursor: pointer;
            width: 100%;
            flex: 1 0 100%;

        .notif-sub-item .notif-body {

        .notif-sub-item-title {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .notif-sub-item-desc {

            color: var(--text-muted);
        }
        /* Muted badge colors for dark mode compatibility */
        .notif-icon-badge.badge-critical {
            background-color: rgba(239, 68, 68, 0.15); /* Muted red */

        .notif-icon-badge.badge-high {
            background-color: rgba(245, 158, 11, 0.15); /* Muted amber */
            color: #f59e0b; /* var(--warning) */
        }

    <script>
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            // Run checks on load to make sure alerts are up to date
            Storage.runStockCheckAndNotify();

            renderNotifications();
            setupFilterListeners();
            setupActionButtons();
        });

        function setupFilterListeners() {
            const pills = document.querySelectorAll('.notif-filter-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', () => {
                    pills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    currentFilter = pill.dataset.filter;
                    renderNotifications();
                });
            });
        }

        function setupActionButtons() {
            
            document.getElementById('btn-notif-read-all')?.addEventListener('click', () => {
                const unreadCards = document.querySelectorAll('.notif-card.unread');
                unreadCards.forEach((card, i) => {
                    setTimeout(() => {
                        card.classList.remove('unread');
                        const btn = card.querySelector('.btn-read-single');
                        if(btn) btn.style.display = 'none';
                    }, i * 50); // Staggered animation
                });
                
                setTimeout(() => {
                    NotificationService.markAllAsRead();
                    Utils.showToast("All notifications marked as read.", "success");
                    renderNotifications();
                }, unreadCards.length * 50 + 300);
            });


            document.getElementById('btn-notif-clear')?.addEventListener('click', () => {
                Utils.confirm(
                    "Clear all notifications?",
                    "Are you sure you want to remove all notifications from history?",
                    () => {
                        NotificationService.clearAll();
                        Utils.showToast("Notification history cleared.", "success");
                        renderNotifications();
                    }
                );
            });
        }

        
        function updateFilterBadges(notifications) {
            const counts = {
                all: notifications.filter(n => !n.read).length,
                unread: notifications.filter(n => !n.read).length,
                stock: notifications.filter(n => !n.read && (n.type === 'LOW_STOCK' || n.type === 'OUT_OF_STOCK')).length,
                customers: notifications.filter(n => !n.read && (n.type === 'CUSTOMER_DUE' || n.type === 'CUSTOMER_OVERDUE')).length,
                payments: notifications.filter(n => !n.read && n.type === 'PAYMENT_RECEIVED').length,
                system: notifications.filter(n => !n.read && (n.type === 'SYSTEM' || n.type === 'SALE_COMPLETED' || n.type === 'DAILY_SUMMARY')).length
            };
            
            document.querySelectorAll('.notif-filter-pill').forEach(pill => {
                const filter = pill.dataset.filter;
                const count = counts[filter] || 0;
                let badge = pill.querySelector('.badge');
                if (count > 0) {
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'badge';
                        pill.appendChild(badge);
                    }
                    badge.textContent = count;
                } else if (badge) {
                    badge.remove();
                }
            });
        }
        
        function getEmptyStateText(filter) {
            if (filter === 'payments') return "No payment notifications right now";
            if (filter === 'stock') return "No stock notifications right now";
            if (filter === 'customers') return "No customer notifications right now";
            if (filter === 'unread') return "No unread notifications right now";
            return "You have no notifications in this category.";
        }

        function getEmptyStateText(filter) {
            if (filter === 'payments') return "No payment notifications right now";
            if (filter === 'stock') return "No stock notifications right now";
            if (filter === 'customers') return "No customer notifications right now";
            if (filter === 'unread') return "No unread notifications right now";
            return "You have no notifications in this category.";
        }

        function createNotificationHTML(n, isSubItem = false) {
            let iconName = 'bell';
            let badgeClass = 'badge-normal';
            let badgeStyle = 'background-color: var(--surface-sec); color: var(--text-muted);';

            if (n.type === 'OUT_OF_STOCK') {
                iconName = 'package-x';
                badgeClass = 'badge-critical';
                badgeStyle = '';
            } else if (n.type === 'LOW_STOCK') {
                iconName = 'triangle-alert';
                badgeClass = 'badge-high';
                badgeStyle = '';
            } else if (n.type === 'CUSTOMER_OVERDUE') {
                iconName = 'triangle-alert';
                badgeClass = 'badge-critical';
                badgeStyle = '';
            } else if (n.type === 'CUSTOMER_DUE') {
                iconName = 'wallet-cards';
                badgeClass = 'badge-high';
                badgeStyle = '';
            } else if (n.type === 'PAYMENT_RECEIVED') {
                iconName = 'circle-dollar-sign';
                badgeStyle = 'background-color: var(--success-tint); color: var(--success);';
            } else if (n.type === 'SALE_COMPLETED') {
                iconName = 'receipt';
                badgeStyle = 'background-color: var(--surface-sec); color: var(--accent);';
            } else if (n.type === 'DAILY_SUMMARY') {
                iconName = 'bar-chart-2';
                badgeStyle = 'background-color: var(--surface-sec); color: var(--accent);';
            }

            const timeStr = formatRelativeTime(n.createdAt || n.date);
            const unreadClass = n.read ? '' : 'unread';

            let priorityTag = '';
            let severityClass = '';
            if (n.priority === 'CRITICAL' || n.type === 'OUT_OF_STOCK') {
                priorityTag = `<span class="notif-priority-tag priority-critical">Critical</span>`;
                severityClass = 'severity-critical';
            } else if (n.priority === 'HIGH' || n.type === 'LOW_STOCK') {
                priorityTag = `<span class="notif-priority-tag priority-high">High</span>`;
                severityClass = 'severity-high';
            }

            if (isSubItem) {
                // Simplify text, don't repeat "Out of Stock Alert"
                // Assuming message is like '"Product Name" is out of stock! Restock required.'
                let shortTitle = n.title; // Default
                let shortDesc = n.message;
                
                // Extract product name if it's in quotes
                const match = n.message.match(/"([^"]+)"/);
                if (match) {
                    shortTitle = match[1];
                    shortDesc = "Restock required · " + timeStr;
                } else {
                    shortTitle = n.message.split(' is')[0] || n.message;
                    shortDesc = timeStr;
                }

                return `
                    <div class="notif-sub-item ${unreadClass}" data-id="${n.id}" data-type="${n.type}" data-target="${n.entityId || n.targetId || ''}">
                        <div class="swipe-actions">
                            <i data-lucide="trash-2"></i>
                        </div>
                        <div class="notif-content-wrapper" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)">
                            <div class="notif-body">
                                <div class="notif-sub-item-title">
                                    ${shortTitle}
                                    ${priorityTag}
                                </div>
                                <span class="notif-sub-item-desc">${shortDesc}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="notif-card ${unreadClass} ${severityClass}" data-id="${n.id}" data-type="${n.type}" data-target="${n.entityId || n.targetId || ''}">
                    <div class="swipe-actions">
                        <i data-lucide="trash-2"></i>
                    </div>
                    <div class="notif-content-wrapper" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)">
                        <div class="notif-icon-badge ${badgeClass}" style="${badgeStyle}">
                            <i data-lucide="${iconName}"></i>
                        </div>
                        <div class="notif-body">
                            <div class="notif-header-line">
                                <span class="notif-title">
                                    ${n.title}
                                    ${priorityTag}
                                </span>
                            </div>
                            <span class="notif-msg">${n.message}</span>
                            <span class="notif-time">${timeStr}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        let startX = 0;
        let currentX = 0;
        let swipeTarget = null;
        
        window.handleTouchStart = function(e) {
            swipeTarget = e.currentTarget;
            startX = e.touches[0].clientX;
            swipeTarget.style.transition = 'none';
        }
        window.handleTouchMove = function(e) {
            if (!swipeTarget) return;
            currentX = e.touches[0].clientX;
            let diff = currentX - startX;
            if (diff < -75) diff = -75; // max swipe distance
            if (diff > 0) diff = 0; // no right swipe
            swipeTarget.style.transform = `translateX(${diff}px)`;
        }
        window.handleTouchEnd = function(e) {
            if (!swipeTarget) return;
            let diff = currentX - startX;
            swipeTarget.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
            
            // Reattach wrapper reference for setTimeout/events
            const wrapper = swipeTarget;
            swipeTarget = null;
            
            if (diff < -40) {
                // Swipe threshold met, lock open
                wrapper.style.transform = `translateX(-75px)`;
                
                // Bind click to the revealed swipe action (the trash bin behind it)
                const swipeAction = wrapper.previousElementSibling;
                if (swipeAction) {
                    swipeAction.onclick = (ev) => {
                        ev.stopPropagation();
                        dismissItem(wrapper);
                    };
                }
                
                // Auto-close if they don't click it after 3 seconds
                setTimeout(() => {
                    if (wrapper && wrapper.style) {
                        wrapper.style.transform = `translateX(0)`;
                    }
                }, 3000);
            } else {
                // Snap back
                wrapper.style.transform = `translateX(0)`;
            }
        }
        
        function dismissItem(wrapper) {
            const item = wrapper.closest('.notif-card') || wrapper.closest('.notif-sub-item');
            if (!item) return;
            
            const id = item.dataset.id;
            const isGroupItem = item.classList.contains('notif-sub-item');
            
            item.classList.add('removing');
            
            setTimeout(() => {
                NotificationService.deleteNotification(id);
                
                if (isGroupItem) {
                    // Update header count or remove group
                    const groupContainer = item.closest('.notif-card');
                    if (groupContainer) {
                        const remaining = groupContainer.querySelectorAll('.notif-sub-item:not(.removing)');
                        if (remaining.length === 0) {
                            groupContainer.classList.add('removing');
                            setTimeout(() => renderNotifications(), 300);
                        } else {
                            const titleSpan = groupContainer.querySelector('.group-count-title');
                            if (titleSpan) {
                                let typeStr = item.dataset.type === 'OUT_OF_STOCK' ? 'out of stock' : 'running low';
                                titleSpan.textContent = `${remaining.length} items ${typeStr}`;
                            }
                            item.remove();
                        }
                    } else {
                        renderNotifications();
                    }
                } else {
                    renderNotifications();
                }
            }, 300);
        }

        window.toggleGroup = function(e) {
            const header = e.currentTarget;
            const content = header.nextElementSibling;
            const chevron = header.querySelector('.chevron');
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                if (chevron) chevron.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('expanded');
                if (chevron) chevron.style.transform = 'rotate(180deg)';
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notifications-list-container');
            if (!container) return;

            let allNotifications = Storage.getNotifications();
            updateFilterBadges(allNotifications);
            
            let notifications = allNotifications;

            // Filter notifications
            if (currentFilter === 'unread') {
                notifications = notifications.filter(n => !n.read);
            } else if (currentFilter === 'stock') {
                notifications = notifications.filter(n => n.type === 'LOW_STOCK' || n.type === 'OUT_OF_STOCK');
            } else if (currentFilter === 'customers') {
                notifications = notifications.filter(n => n.type === 'CUSTOMER_DUE' || n.type === 'CUSTOMER_OVERDUE');
            } else if (currentFilter === 'payments') {
                notifications = notifications.filter(n => n.type === 'PAYMENT_RECEIVED');
            } else if (currentFilter === 'system') {
                notifications = notifications.filter(n => n.type === 'SYSTEM' || n.type === 'SALE_COMPLETED' || n.type === 'DAILY_SUMMARY');
            }

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-md); margin-top: 10px;">
                        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--surface-sec); color: var(--text-muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
                            <i data-lucide="bell-off" style="width: 24px; height: 24px;"></i>
                        </div>
                        <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px;">No Notifications</h3>
                        <p style="font-size: 0.78rem; color: var(--text-muted); margin: 0;">${getEmptyStateText(currentFilter)}</p>
                    </div>
                `;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            // Group notifications into TODAY, YESTERDAY, OLDER
            const todayStr = new Date().toDateString();
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toDateString();

            const groups = {
                'TODAY': [],
                'YESTERDAY': [],
                'OLDER': []
            };

            notifications.forEach(n => {
                const nDate = new Date(n.createdAt || n.date);
                const nDateStr = nDate.toDateString();

                if (nDateStr === todayStr) {
                    groups['TODAY'].push(n);
                } else if (nDateStr === yesterdayStr) {
                    groups['YESTERDAY'].push(n);
                } else {
                    groups['OLDER'].push(n);
                }
            });

            let html = '';

            for (const [sectionTitle, notifList] of Object.entries(groups)) {
                if (notifList.length === 0) continue;

                html += `<div class="notif-section-title">${sectionTitle}</div>`;
                html += `<div class="notifications-feed">`;

                // Sub-grouping for repetitive alerts
                let currentGroup = [];
                const renderCurrentGroup = () => {
                    if (currentGroup.length === 0) return '';
                    if (currentGroup.length < 4) {
                        return currentGroup.map(n => createNotificationHTML(n)).join('');
                    } else {
                        const type = currentGroup[0].type;
                        const unreadCount = currentGroup.filter(n => !n.read).length;
                        const severityClass = type === 'OUT_OF_STOCK' ? 'severity-critical' : 'severity-high';
                        const badgeClass = type === 'OUT_OF_STOCK' ? 'badge-critical' : 'badge-high';
                        
                        let title = `${currentGroup.length} items out of stock`;
                        if (type === 'LOW_STOCK') title = `${currentGroup.length} items running low`;
                        
                        let res = `<div class="notif-card ${severityClass}" style="flex-direction: column; padding: 0;">
                            <div class="notif-group-header" onclick="toggleGroup(event)">
                                <div style="display:flex; align-items:center; gap:12px;">
                                    <div class="notif-icon-badge ${badgeClass}">
                                        <i data-lucide="${type === 'OUT_OF_STOCK' ? 'package-x' : 'triangle-alert'}" style="width:18px;height:18px;"></i>
                                    </div>
                                    <span class="group-count-title">${title}</span>
                                </div>
                                <i data-lucide="chevron-down" class="chevron" style="transition: transform 0.3s; color: var(--text-muted);"></i>
                            </div>
                            <div class="notif-group-content">
                                ${currentGroup.map(n => createNotificationHTML(n, true)).join('')}
                            </div>
                        </div>`;
                        return res;
                    }
                };

                for (let i = 0; i < notifList.length; i++) {
                    const n = notifList[i];
                    if (n.type === 'OUT_OF_STOCK' || n.type === 'LOW_STOCK') {
                        if (currentGroup.length === 0 || currentGroup[0].type === n.type) {
                            currentGroup.push(n);
                        } else {
                            html += renderCurrentGroup();
                            currentGroup = [n];
                        }
                    } else {
                        if (currentGroup.length > 0) {
                            html += renderCurrentGroup();
                            currentGroup = [];
                        }
                        html += createNotificationHTML(n);
                    }
                }
                if (currentGroup.length > 0) {
                    html += renderCurrentGroup();
                }

                html += `</div>`;
            }

            container.innerHTML = html;

            // Click handling on wrapper to navigate
            container.querySelectorAll('.notif-content-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', (e) => {
                    // Ignore clicks if wrapper is swiped open
                    if (wrapper.style.transform && wrapper.style.transform !== 'translateX(0px)') {
                        wrapper.style.transform = 'translateX(0)';
                        return; 
                    }
                    
                    const card = wrapper.closest('.notif-card') || wrapper.closest('.notif-sub-item');
                    if (!card || !card.dataset.id) return; // Might be group header wrapper (but they don't have this class)

                    const id = card.dataset.id;
                    const type = card.dataset.type;
                    const target = card.dataset.target;

                    NotificationService.markAsRead(id);

                    if (type === 'LOW_STOCK' || type === 'OUT_OF_STOCK') {
                        if (target) {
                            window.location.href = `product-details.html?id=${target}`;
                        } else {
                            window.location.href = '../../pages/inventory/stock.html';
                        }
                    } else if (type === 'CUSTOMER_DUE' || type === 'CUSTOMER_OVERDUE' || type === 'PAYMENT_RECEIVED') {
                        if (target) {
                            window.location.href = `customer-details.html?id=${target}`;
                        } else {
                            window.location.href = '../../pages/customers/customers.html';
                        }
                    } else if (type === 'SALE_COMPLETED') {
                        window.location.href = '../../pages/sales/sales.html';
                    } else if (type === 'DAILY_SUMMARY') {
                        window.location.href = '../../pages/settings/settings.html?section=reports';
                    }
                });
            });

            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
function formatRelativeTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHr = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHr / 24);

            if (diffMin < 1) return 'Just now';
            if (diffMin === 1) return '1 minute ago';
            if (diffMin < 60) return `${diffMin} minutes ago`;
            if (diffHr === 1) return '1 hour ago';
            if (diffHr < 24) return `${diffHr} hours ago`;
            if (diffDay === 1) return 'Yesterday';
            if (diffDay < 7) return `${diffDay} days ago`;
            return Utils.formatDate(dateStr);
        }
    </script>
</body>
</html>
