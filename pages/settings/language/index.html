<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../../../';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Language Settings - Cashly</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Application Styles -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/settings.css">
    <script src="../../../js/loader.js"></script>
    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../../images/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
</head>
<body data-page="settings-language">

    <!-- Page Preloader -->
    <div id="page-preloader" class="page-preloader">
        <div class="preloader-content">
            <div class="preloader-logo-ring">
                <div class="preloader-spinner-outer"></div>
                <div class="preloader-spinner-inner"></div>
                <div class="preloader-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </div>
            </div>
            <div class="preloader-brand">Cashly</div>
            <div class="preloader-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- Injected Global Header -->
    <div id="app-header"></div>

    <main class="settings-subpage-standalone">
<div class="settings-subpage" id="subpage-language">
        <div class="settings-subpage-header">
            <a href="../settings.html" class="back-nav-settings"><i data-lucide="arrow-left"></i></a>
            <span class="settings-subpage-title">Language</span>
        </div>
        <div class="settings-subpage-content">
            <div class="settings-group-title">App Language</div>
            <div class="settings-rows-list" style="margin-bottom: 24px;">
                <div class="radio-row" data-lang-val="English" id="lang-opt-en">
                    <span class="radio-label">English</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
                <div class="radio-row" data-lang-val="Hindi" id="lang-opt-hi">
                    <span class="radio-label">Hindi (हिंदी)</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
                <div class="radio-row" data-lang-val="Arabic" id="lang-opt-ar">
                    <span class="radio-label">Arabic (العربية)</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
                <div class="radio-row" data-lang-val="Spanish" id="lang-opt-es">
                    <span class="radio-label">Spanish (Español)</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
            </div>
        </div>
    </div>
    </main>

    <!-- Injected Global Bottom Navigation -->
    <nav id="app-navigation"></nav>

    <!-- Application Script -->
    <script src="../../../js/storage.js"></script>
    <script src="../../../js/utils.js"></script>
    <script src="../../../js/notifications.js"></script>
    <script src="../../../js/settings.js"></script>
</body>
</html>
