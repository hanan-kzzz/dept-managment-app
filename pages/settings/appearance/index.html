<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../../../';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appearance Settings - Cashly</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Application Styles -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/settings.css">
        <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../../images/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
</head>
<body data-page="settings-appearance">

    <div id="app-header"></div>

    <main class="settings-subpage-standalone">
<div class="settings-subpage" id="subpage-appearance">
        <div class="settings-subpage-header">
            <a href="../settings.html" class="back-nav-settings"><i data-lucide="arrow-left"></i></a>
            <span class="settings-subpage-title">Appearance</span>
        </div>
        <div class="settings-subpage-content">
            <div class="settings-group-title">Theme</div>
            <div class="settings-rows-list" style="margin-bottom: 24px;">
                <div class="radio-row" data-theme-val="light" id="theme-opt-light">
                    <span class="radio-label">Light</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
                <div class="radio-row" data-theme-val="dark" id="theme-opt-dark">
                    <span class="radio-label">Dark</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
                <div class="radio-row" data-theme-val="system" id="theme-opt-system">
                    <span class="radio-label">System</span>
                    <span class="radio-check"><i data-lucide="check"></i></span>
                </div>
            </div>
        </div>
    </div>
    </main>

    <!-- Injected Global Bottom Navigation -->
    <nav id="app-navigation"></nav>

    <!-- Application Script -->
    <script src="../../../js/storage.js"></script>
    <script src="../../../js/utils.js"></script>
    <script src="../../../js/notifications.js"></script>
    <script src="../../../js/settings.js"></script>
</body>
</html>
