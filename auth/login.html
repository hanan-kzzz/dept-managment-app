<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log In - Cashly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/auth.css">
        <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cashly">
</head>
<body>

    <div class="hero-bg tall" style="background-image: url('../images/bg_login_char.jpg'); background-size: cover; background-position: right center; background-repeat: no-repeat;">
    
    <div class="hero-content max-w-md mx-auto w-full">
      <a href="welcome.html" class="back-btn">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </a>
      
      <div class="hero-content-flex">
        <div>
          <h1 class="hero-title shadow-text">Welcome<br>Back</h1>
          <p class="hero-subtitle shadow-text">Log in to your Cashly account</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <div class="auth-container max-w-md mx-auto w-full">
    
    <div class="wave-divider">
      <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
          <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C84.34,74.96,162.77,65.34,321.39,56.44Z" class="shape-fill"></path>
      </svg>
    </div>

    <form onsubmit="handleLogin(event)" class="flex flex-col flex-grow">
      
      <div class="input-group">
        <i data-lucide="mail" class="input-icon w-5 h-5"></i>
        <input type="email" placeholder="Email Address" class="input-field" required value="user@example.com">
        <i data-lucide="check-circle-2" class="validation-icon show-valid w-5 h-5"></i>
      </div>
      
      <div class="input-group mb-2">
        <i data-lucide="lock" class="input-icon w-5 h-5"></i>
        <input type="password" id="password-input" placeholder="Password" class="input-field pr-12" required value="password123">
        <div class="password-toggle" onclick="togglePassword()">
          <i data-lucide="eye" class="eye-on w-5 h-5"></i>
          <i data-lucide="eye-off" class="eye-off w-5 h-5"></i>
        </div>
      </div>

      <div class="flex justify-end mb-6">
        <a href="forgot-password.html" class="link text-sm">Forgot password?</a>
      </div>

      <div class="mt-auto space-y-3">
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">Log in</span>
          <i data-lucide="loader-2" class="loader-icon w-5 h-5"></i>
          <i data-lucide="check" class="check-icon w-5 h-5"></i>
        </button>
        
        <div class="divider">
          <span>or sign in with</span>
        </div>
        
        <div class="flex justify-center gap-4 mt-6">
          <button type="button" class="social-btn-circle">
            <!-- Example using SVG for full color -->
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          </button>
          <button type="button" class="social-btn-circle">
            <i data-lucide="apple" class="w-5 h-5 text-slate-800"></i>
          </button>
        </div>
      </div>
      
      <div class="secure-footer mt-6">
        Don't have an account? <a href="signup.html" class="link">Sign up</a>
      </div>
    </form>
  </div>

  <script>
    lucide.createIcons();
    
    function togglePassword() {
      const input = document.getElementById('password-input');
      const toggle = document.querySelector('.password-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.classList.add('show');
      } else {
        input.type = 'password';
        toggle.classList.remove('show');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.classList.add('btn-loading');
      btn.disabled = true;
      
      setTimeout(() => {
        btn.classList.remove('btn-loading');
        btn.classList.add('btn-success');
        
        setTimeout(() => {
          window.location.href = '../index.html';
        }, 800);
      }, 1000);
    }
  </script>
    <script src="../js/pwa.js"></script>
</body>
</html>
