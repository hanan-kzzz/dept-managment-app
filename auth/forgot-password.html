<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forgot Password - Cashly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/loader.js"></script>
    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
</head>
<body>

    <!-- Page Preloader -->
    <div id="page-preloader" class="page-preloader">
        <div class="preloader-content">
            <div class="preloader-logo-ring">
                <div class="preloader-spinner-outer"></div>
                <div class="preloader-spinner-inner"></div>
                <div class="preloader-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </div>
            </div>
            <div class="preloader-brand">Cashly</div>
            <div class="preloader-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

  <!-- Hero Section -->
  <div class="hero-bg short">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    
    <div class="hero-content max-w-md mx-auto w-full">
      <a href="login.html" class="back-btn">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </a>
      <div class="hero-content-flex mt-6">
        <h1 class="hero-title shadow-text">Forgot<br>Password?</h1>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <div class="auth-container short-hero-margin max-w-md mx-auto w-full">
    
    <!-- Straddle Icon Badge -->
    <div class="straddle-badge">
      <div class="icon-wrapper">
        <i data-lucide="lock-keyhole" class="w-8 h-8"></i>
      </div>
    </div>
    
    <div class="wave-divider">
      <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
          <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C84.34,74.96,162.77,65.34,321.39,56.44Z" class="shape-fill"></path>
      </svg>
    </div>

    <p class="text-slate-500 mb-6 font-medium leading-relaxed mt-10 text-center">
      Enter your registered email address and we'll send you a secure reset code.
    </p>

    <form onsubmit="handleForgot(event)" class="flex flex-col mt-4">
      
      <div class="input-group mb-8">
        <i data-lucide="mail" class="input-icon w-5 h-5"></i>
        <input type="email" id="forgot-email" placeholder="Email Address" class="input-field" required>
        <i data-lucide="check-circle-2" class="validation-icon show-valid w-5 h-5"></i>
      </div>

      <div class="mt-4 pb-4">
        <button type="submit" class="btn-primary" id="forgotBtn">
          <span class="btn-text">Send Reset Code</span>
          <i data-lucide="loader-2" class="loader-icon w-5 h-5"></i>
          <i data-lucide="check" class="check-icon w-5 h-5"></i>
        </button>
      </div>
    </form>
  </div>

  <script>
    lucide.createIcons();
    
    function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const email = document.getElementById('forgot-email').value;
      
      btn.classList.add('btn-loading');
      btn.disabled = true;
      
      setTimeout(() => {
        btn.classList.remove('btn-loading');
        btn.classList.add('btn-success');
        
        setTimeout(() => {
          localStorage.setItem('otpEmail', email);
          localStorage.setItem('otpContext', 'forgot');
          window.location.href = '../auth/otp-verification.html';
        }, 800);
      }, 1000);
    }
  </script>
</body>
</html>
