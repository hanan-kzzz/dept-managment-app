<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashly - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/loader.js"></script>
    <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800 auth-body">

    <!-- Page Preloader -->
    <div id="page-preloader" class="page-preloader" style="display: none !important;">
        <div class="preloader-content">
            <div class="preloader-logo-ring">
                <div class="preloader-spinner-outer"></div>
                <div class="preloader-spinner-inner"></div>
                <div class="preloader-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" style="width:26px !important;height:26px !important;max-width:26px !important;max-height:26px !important;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </div>
            </div>
            <div class="preloader-brand">Cashly</div>
            <div class="preloader-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>
  <div class="w-full max-w-md bg-white auth-card p-8 sm:p-10 relative overflow-hidden">
    <div class="text-center mb-10 pt-4">
      <div class="logo-badge-container mx-auto mb-5">
        <div class="logo-badge-glow"></div>
        <div class="logo-badge">
          <i data-lucide="wallet" class="w-7 h-7 stroke-[2.5px]"></i>
        </div>
      </div>
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">Set New Password</h2>
      <p class="text-sm font-medium text-gray-500">Choose a strong password for your Cashly account.</p>
    </div>

    <form onsubmit="handleReset(event)">
      <div class="space-y-4 mb-10">
        <div class="input-wrapper">
          <i data-lucide="lock" class="w-5 h-5 input-icon left-4"></i>
          <input type="password" placeholder="New Password" class="input-field pl-11" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="shield-check" class="w-5 h-5 input-icon left-4"></i>
          <input type="password" placeholder="Confirm New Password" class="input-field pl-11" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="resetBtn">
        Reset Password
      </button>
    </form>
  </div>
  
  <script>
    lucide.createIcons();
    
    function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Updating...';
      lucide.createIcons();
      btn.disabled = true;
      
      setTimeout(() => {
        btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> Password Reset';
        btn.style.backgroundColor = '#10b981';
        btn.style.boxShadow = '0 4px 14px rgba(16, 185, 129, 0.3)';
        lucide.createIcons();
        
        setTimeout(() => {
          window.location.href = '../auth/login.html';
        }, 1000);
      }, 1200);
    }
  </script>
</body>
</html>
