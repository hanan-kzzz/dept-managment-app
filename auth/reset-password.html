<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.BASE_PATH = '../';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cashly - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/auth.css">
        <!-- Favicon & PWA App Icons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cashly">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800 auth-body">
            <div class="preloader-brand">Cashly</div>
            <div class="preloader-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>
  <div class="w-full max-w-md bg-white auth-card p-8 sm:p-10 relative overflow-hidden">
    <div class="text-center mb-10 pt-4">
      <div class="logo-badge-container mx-auto mb-5">
        <div class="logo-badge-glow"></div>
        <div class="logo-badge">
          <i data-lucide="wallet" class="w-7 h-7 stroke-[2.5px]"></i>
        </div>
      </div>
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight mb-2">Set New Password</h2>
      <p class="text-sm font-medium text-gray-500">Choose a strong password for your Cashly account.</p>
    </div>

    <form onsubmit="handleReset(event)">
      <div class="space-y-4 mb-10">
        <div class="input-wrapper">
          <i data-lucide="lock" class="w-5 h-5 input-icon left-4"></i>
          <input type="password" placeholder="New Password" class="input-field pl-11" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="shield-check" class="w-5 h-5 input-icon left-4"></i>
          <input type="password" placeholder="Confirm New Password" class="input-field pl-11" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="resetBtn">
        Reset Password
      </button>
    </form>
  </div>
  
  <script>
    lucide.createIcons();
    
    function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Updating...';
      lucide.createIcons();
      btn.disabled = true;
      
      setTimeout(() => {
        btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> Password Reset';
        btn.style.backgroundColor = '#10b981';
        btn.style.boxShadow = '0 4px 14px rgba(16, 185, 129, 0.3)';
        lucide.createIcons();
        
        setTimeout(() => {
          window.location.href = '../auth/login.html';
        }, 1000);
      }, 1200);
    }
  </script>
    <script src="../js/pwa.js"></script>
</body>
</html>
